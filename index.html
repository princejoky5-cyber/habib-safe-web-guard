<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাইবার গার্ড বিডি</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        button {
            padding: 12px 20px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #059669;
        }
        .result-box {
            display: none;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #10b981;
            background-color: rgba(16, 185, 129, 0.1);
            text-align: left;
        }
        .result-status {
            color: #34d399;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .result-date {
            color: #94a3b8;
            font-size: 12px;
            border-top: 1px dashed #334155;
            padding-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>সাইবার গার্ড বিডি</h1>
    <p class="subtitle">আপনার ডিজিটাল সুরক্ষায় বিশ্বস্ত লিংক স্ক্যানার</p>
    
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="এখানে লিংক পেস্ট করুন...">
        <button onclick="checkLink()">যাচাই করুন</button>
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-status" id="resultStatus"></div>
        <div class="result-date" id="resultDate"></div>
    </div>
</div>

<script>
    function checkLink() {
        const url = document.getElementById('urlInput').value;
        const resultBox = document.getElementById('resultBox');
        const resultStatus = document.getElementById('resultStatus');
        const resultDate = document.getElementById('resultDate');

        if (!url) {
            alert('অনুগ্রহ করে একটি লিংক প্রবেশ করান!');
            return;
        }

        // আউটপুট দেখানোর জন্য
        resultStatus.innerText = "নিরাপদ মনে হচ্ছে! এই লিংকটিতে তাৎক্ষণিক কোনো ক্ষতিকর উপাদান পাওয়া যায়নি। তবে সাবধানে ব্রাউজ করুন।";
        
        // বর্তমান তারিখ ও সময় বের করার নিয়ম
        const now = new Date();
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        const formattedDate = now.toLocaleDateString('bn-BD', dateOptions);

        resultDate.innerText = "যাচাইকরণের তারিখ ও সময়: " + formattedDate;
        
        resultBox.style.display = "block";
    }
</script>

</body>
</html>
