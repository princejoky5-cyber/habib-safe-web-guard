<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাইবার গার্ড বিডি</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        button {
            padding: 12px 20px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #059669;
        }
        .result-box {
            display: none;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin-top: 15px;
        }
        .result-safe {
            border: 1px solid #10b981;
            background-color: rgba(16, 185, 129, 0.1);
        }
        .result-warning {
            border: 1px solid #f59e0b;
            background-color: rgba(245, 158, 11, 0.1);
        }
        .result-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .text-safe { color: #34d399; }
        .text-warning { color: #fbbf24; }
        .result-desc {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .result-domain-info {
            color: #94a3b8;
            font-size: 12px;
            border-top: 1px dashed #334155;
            padding-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>সাইবার গার্ড বিডি</h1>
    <p class="subtitle">আপনার ডিজিটাল সুরক্ষায় বিশ্বস্ত লিংক স্ক্যানার</p>
    
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="যাচাই করতে লিংকটি পেস্ট করুন...">
        <button onclick="checkLink()">যাচাই করুন</button>
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-title" id="resultTitle"></div>
        <div class="result-desc" id="resultDesc"></div>
        <div class="result-domain-info" id="resultDomain"></div>
    </div>
</div>

<script>
    function checkLink() {
        const input = document.getElementById('urlInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultDesc = document.getElementById('resultDesc');
        const resultDomain = document.getElementById('resultDomain');

        if (!input) {
            alert('অনুগ্রহ করে একটি সঠিক ওয়েবসাইটের লিংক দিন!');
            return;
        }

        let hostname = "";
        try {
            let formattedUrl = input;
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                formattedUrl = 'https://' + input;
            }
            const parsedUrl = new URL(formattedUrl);
            hostname = parsedUrl.hostname;
        } catch (e) {
            hostname = input;
        }

        // সাধারণ সন্দেহজনক ফিশিং প্যাটার্ন বা ভুয়া ডোমেইন এক্সটেনশন চেক
        const suspiciousPatterns = ['login-', 'verify-', 'free-', 'offer-', 'bkash-', '000webhost', '0nline', 'g00gle'];
        const isSuspicious = suspiciousPatterns.some(pattern => hostname.toLowerCase().includes(pattern));

        resultBox.style.display = "block";

        if (isSuspicious) {
            resultBox.className = "result-box result-warning";
            resultTitle.className = "result-title text-warning";
            resultTitle.innerText = "⚠️ সতর্কবার্তা: সম্ভাব্য ফিশিং বা ভুয়া লিংক!";
            resultDesc.innerText = "এই লিংকটির নাম ও স্পেলিংয়ে সন্দেহজনক ফিশিং প্যাটার্ন চিহ্নিত হয়েছে। এমন লিংক ব্যবহার করে ব্যক্তিগত তথ্য চুরি বা আর্থিক জালিয়াতি হতে পারে।";
            resultDomain.innerText = "স্ক্যান করা ডোমেইন: " + hostname + " (নতুন বা অনিরাপদ উৎস)";
        } else {
            resultBox.className = "result-box result-safe";
            resultTitle.className = "result-title text-safe";
            resultTitle.innerText = "✅ সাইট স্ট্যাটাস: নিরাপদ";
            resultDesc.innerText = "লিংকটিতে কোনো পরিচিত জালিয়াতি বা ফিশিং প্যাটার্ন পাওয়া যায়নি। এটি একটি নিবন্ধিত ও সাধারণ ওয়েব ঠিকানা।";
            resultDomain.innerText = "স্ক্যান করা ডোমেইন: " + hostname;
        }
    }
</script>

</body>
</html>
